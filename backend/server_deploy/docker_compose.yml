# Docker deploy
services:
  # mongo container
  mongo:
    image: mongo
    container_name: mongodb
    restart: always
    env_file: ../backend/.env
    ports:
      - "27017:27017"
    expose:
      - 27017
    volumes:
      - mongo-data:/data/db

  # backend container
  backend:
    image: idoshahar/tahash-backend:v0.1
    container_name: backend
    environment:
      - NODE_ENV=production
      - MONGO_SERVICE=mongodb
    ports:
      - "3000:3000"
    volumes:
      - backend-data:/app/data
    env_file:
      - .env
    depends_on:
      - mongo

  frontend:
    image: idoshahar/tahash-frontend:v0.1
    container_name: frontend
    environment:
      - NODE_ENV=production
    args:
      - VITE_API_PATH=http://comp.ilcubers.com/api
    ports:
      - "443:443"
    volumes:
      - ../frontend:/app
    depends_on:
      - backend

volumes:
  mongo-data:
    driver: local
  backend-data:
